pre-commit:
    parallel: true
    commands:
        lint:
            glob: '*.{js,ts,jsx,tsx,json}'
            run: yarn lint
        format:
            glob: '*.{js,ts,jsx,tsx,json,yml,yaml,md}'
            run: yarn dlx prettier --write {staged_files}
            stage_fixed: true
        typecheck:
            glob: '*.{js,ts,jsx,tsx,json}'
            run: yarn typecheck
commit-msg:
    parallel: true
    commands:
        commitlint:
            run: npx commitlint --edit
